name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/usr/plugins/a0_scribe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python -m unittest tests.test_state_tracking tests.test_skill_contracts tests.test_review_findings tests.test_imperium_client -v
        working-directory: workspace/usr/plugins/a0_scribe
      - run: python -m compileall -q helpers extensions execute.py
        working-directory: workspace/usr/plugins/a0_scribe
      - run: git diff --check
        working-directory: workspace/usr/plugins/a0_scribe
